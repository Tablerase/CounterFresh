<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="100%"
  height="180" class="overflow-visible">
  <defs>
    <!-- Background Card Gradient matching app surface tokens -->
    <linearGradient id="card-surface-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261543" />
      <stop offset="100%" stop-color="#1b0833" />
    </linearGradient>

    <!-- Button Surface Gradient matching Button.tsx -->
    <linearGradient id="btn-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2768" />
      <stop offset="100%" stop-color="#2d174d" />
    </linearGradient>

    <!-- Ambient Uncropped Radial Glow radiating from behind button -->
    <radialGradient id="button-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b5a4f0" stop-opacity="0.5">
        <animate attributeName="stop-color"
          values="#b5a4f0;#faae80;#faae80;#b5a4f0;#b5a4f0" dur="3.6s"
          repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#8870cc" stop-opacity="0.25">
        <animate attributeName="stop-color"
          values="#8870cc;#d88c5d;#d88c5d;#8870cc;#8870cc" dur="3.6s"
          repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1f0046" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#b5a4f0" fill-opacity="0.16" />
    </pattern>

    <!-- Uncropped Multi-Stage Neon Glow Filter -->
    <filter id="neon-glow" x="-150%" y="-150%" width="400%" height="400%">
      <!-- Wide atmospheric bloom -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="wide-bloom" />
      <!-- Sharp neon core glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="core-glow" />
      <feMerge>
        <feMergeNode in="wide-bloom" />
        <feMergeNode in="core-glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Righteous&amp;display=swap');

  .title-text {
    font-family: 'Righteous', system-ui, sans-serif;
    font-size: 18px;
    fill: #e5dfff;
    letter-spacing: 0.5px;
  }
  .desc-text {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    fill: #c3bed5;
  }
  .badge-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
  }

  @keyframes headMorph {
    0%,
    15%,
    85%,
    100% {
      d: path("M 16 6 C 16 6 16 26 16 26 C 16 26 16 6 16 6");
      stroke: #f5f3ff;
      stroke-width: 4.5px;
    }
    35%,
    65% {
      d: path("M 16 4 C 10 4 10 12 16 12 C 22 12 22 4 16 4");
      stroke: #faae80;
      stroke-width: 2.8px;
    }
  }

  @keyframes bodyMorph {
    0%,
    15%,
    85%,
    100% {
      d: path("M 6 16 C 12 16 22 16 26 16");
      stroke: #f5f3ff;
      stroke-width: 4.5px;
    }
    35%,
    65% {
      d: path("M 8 28 C 6 12 26 12 24 28");
      stroke: #faae80;
      stroke-width: 2.8px;
    }
  }

  .anim-head {
    animation: headMorph 3.6s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
  }
  .anim-body {
    animation: bodyMorph 3.6s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
  }
  </style>

  <!-- Card Outer Surface with Purple Ambient Shadow -->
  <rect width="558" height="178" x="1" y="1" rx="16"
    fill="url(#card-surface-bg)" stroke="#6442ac" stroke-opacity="0.4"
    stroke-width="1.5" />
  <rect width="556" height="176" x="2" y="2" rx="15" fill="url(#dot-grid)" />

  <!-- Blueprint corner brackets -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#b5a4f0" stroke-opacity="0.3"
    stroke-width="1.5" fill="none" />
  <path d="M 548 24 L 548 12 L 536 12" stroke="#b5a4f0" stroke-opacity="0.3"
    stroke-width="1.5" fill="none" />
  <path d="M 12 156 L 12 168 L 24 168" stroke="#b5a4f0" stroke-opacity="0.3"
    stroke-width="1.5" fill="none" />
  <path d="M 548 156 L 548 168 L 536 168" stroke="#b5a4f0" stroke-opacity="0.3"
    stroke-width="1.5" fill="none" />

  <!-- Ambient Glow spreading outward across card surface (Uncropped) -->
  <circle cx="94" cy="90" r="95" fill="url(#button-ambient-glow)"
    pointer-events="none" />

  <!-- Interactive Button Surface (Matching Button.tsx) -->
  <g transform="translate(34, 30)">
    <!-- Button Round Frame -->
    <rect width="120" height="120" rx="24" fill="url(#btn-surface)"
      stroke="#8870cc" stroke-opacity="0.45" stroke-width="1.5">
      <animate attributeName="stroke"
        values="#8870cc;#faae80;#faae80;#8870cc;#8870cc" dur="3.6s"
        repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.45;0.8;0.8;0.45;0.45"
        dur="3.6s" repeatCount="indefinite" />
    </rect>

    <!-- Inner Button Highlight -->
    <rect width="116" height="116" x="2" y="2" rx="22" fill="none"
      stroke="#b5a4f0" stroke-opacity="0.12" stroke-width="1" />

    <!-- Morphing Participant Icon scaled up with uncropped neon-glow filter -->
    <g transform="translate(60, 60) scale(2.6) translate(-16, -16)"
      filter="url(#neon-glow)" class="overflow-visible">
      <!-- Head Path -->
      <path
        class="anim-head"
        d="M 16 6 C 16 6 16 26 16 26 C 16 26 16 6 16 6"
        fill="none"
        stroke="#f5f3ff"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <animate
          attributeName="d"
          dur="3.6s"
          repeatCount="indefinite"
          keyTimes="0; 0.2; 0.45; 0.7; 0.95; 1"
          keySplines="0.34 1.4 0.64 1; 0 0 1 1; 0.34 1.4 0.64 1; 0 0 1 1; 0 0 1 1"
          calcMode="spline"
          values="
            M 16 6 C 16 6 16 26 16 26 C 16 26 16 6 16 6;
            M 16 4 C 10 4 10 12 16 12 C 22 12 22 4 16 4;
            M 16 4 C 10 4 10 12 16 12 C 22 12 22 4 16 4;
            M 16 6 C 16 6 16 26 16 26 C 16 26 16 6 16 6;
            M 16 6 C 16 6 16 26 16 26 C 16 26 16 6 16 6;
            M 16 6 C 16 6 16 26 16 26 C 16 26 16 6 16 6
          "
        />
        <animate
          attributeName="stroke-width"
          dur="3.6s"
          repeatCount="indefinite"
          keyTimes="0; 0.2; 0.45; 0.7; 0.95; 1"
          values="4.5; 2.8; 2.8; 4.5; 4.5; 4.5"
        />
        <animate
          attributeName="stroke"
          dur="3.6s"
          repeatCount="indefinite"
          keyTimes="0; 0.2; 0.45; 0.7; 0.95; 1"
          values="#f5f3ff; #faae80; #faae80; #f5f3ff; #f5f3ff; #f5f3ff"
        />
      </path>

      <!-- Body Path -->
      <path
        class="anim-body"
        d="M 6 16 C 12 16 22 16 26 16"
        fill="none"
        stroke="#f5f3ff"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <animate
          attributeName="d"
          dur="3.6s"
          repeatCount="indefinite"
          keyTimes="0; 0.2; 0.45; 0.7; 0.95; 1"
          keySplines="0.34 1.4 0.64 1; 0 0 1 1; 0.34 1.4 0.64 1; 0 0 1 1; 0 0 1 1"
          calcMode="spline"
          values="
            M 6 16 C 12 16 22 16 26 16;
            M 8 28 C 6 12 26 12 24 28;
            M 8 28 C 6 12 26 12 24 28;
            M 6 16 C 12 16 22 16 26 16;
            M 6 16 C 12 16 22 16 26 16;
            M 6 16 C 12 16 22 16 26 16
          "
        />
        <animate
          attributeName="stroke-width"
          dur="3.6s"
          repeatCount="indefinite"
          keyTimes="0; 0.2; 0.45; 0.7; 0.95; 1"
          values="4.5; 2.8; 2.8; 4.5; 4.5; 4.5"
        />
        <animate
          attributeName="stroke"
          dur="3.6s"
          repeatCount="indefinite"
          keyTimes="0; 0.2; 0.45; 0.7; 0.95; 1"
          values="#f5f3ff; #faae80; #faae80; #f5f3ff; #f5f3ff; #f5f3ff"
        />
      </path>
    </g>
  </g>

  <!-- Descriptive Text & Specs Column -->
  <g transform="translate(186, 36)">
    <!-- Header -->
    <text x="0" y="16" class="title-text">Topology-Matched Path Morph</text>
    <text x="0" y="40"
      class="desc-text">Morphs "+" into a participant silhouette using identical</text>
    <text x="0" y="58"
      class="desc-text">cubic Bézier segment counts in CSS and SVG.</text>

    <!-- State Badges -->
    <g transform="translate(0, 78)">
      <!-- Rest State Pill -->
      <rect width="138" height="24" rx="6" fill="#1f0046" stroke="#8870cc"
        stroke-opacity="0.6" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#b5a4f0" />
      <text x="24" y="16" fill="#e5dfff" class="badge-text">Rest: Add (+)</text>

      <!-- Arrow -->
      <path d="M 148 12 L 164 12 M 159 7 L 164 12 L 159 17" stroke="#8870cc"
        stroke-width="1.5" fill="none" />

      <!-- Active State Pill -->
      <g transform="translate(174, 0)">
        <rect width="144" height="24" rx="6" fill="#2b0f00" stroke="#faae80"
          stroke-opacity="0.6" stroke-width="1" />
        <circle cx="12" cy="12" r="4" fill="#faae80" />
        <text x="24" y="16" fill="#ffdcc7"
          class="badge-text">Hover: Avatar</text>
      </g>
    </g>
  </g>
</svg>
