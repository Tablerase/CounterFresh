name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: CounterFresh-${{ github.ref_name }}-linux-x64.tar.gz
            build_cmd: |
              tar -czvf CounterFresh-${{ github.ref_name }}-linux-x64.tar.gz -C dist counter-fresh

          - os: macos-latest
            artifact_name: CounterFresh-${{ github.ref_name }}-macos-arm64.zip
            build_cmd: |
              cd dist
              zip -r -y ../CounterFresh-${{ github.ref_name }}-macos-arm64.zip CounterFresh.app
              cd ..

          - os: windows-latest
            artifact_name: CounterFresh-${{ github.ref_name }}-windows-x64.zip
            build_cmd: |
              powershell -Command "Compress-Archive -Path dist/CounterFresh -DestinationPath CounterFresh-${{ github.ref_name }}-windows-x64.zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check & Test
        run: |
          deno task check
          deno task test

      - name: Build Desktop Application
        run: deno task d-build

      - name: Package Release Archive
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact_name }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
